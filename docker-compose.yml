services:
  db:
    image: postgres:16
    # Build/run for x86-64 even when building on an Apple-silicon Mac.
    platform: linux/amd64
    # Offline host: never reach a registry; use the locally loaded image.
    pull_policy: never
    # Tuning: the stock image is sized for a tiny box. These defaults are safe
    # on a modest host; bump them (esp. shared_buffers, the parallel workers) via
    # .env for a big server — see .env.example.
    command:
      - "postgres"
      - "-c"
      - "shared_buffers=${PG_SHARED_BUFFERS:-512MB}"
      - "-c"
      - "effective_cache_size=${PG_EFFECTIVE_CACHE_SIZE:-2GB}"
      - "-c"
      - "work_mem=${PG_WORK_MEM:-64MB}"
      - "-c"
      - "maintenance_work_mem=${PG_MAINTENANCE_WORK_MEM:-256MB}"
      - "-c"
      - "max_worker_processes=${PG_MAX_WORKER_PROCESSES:-8}"
      - "-c"
      - "max_parallel_workers=${PG_MAX_PARALLEL_WORKERS:-8}"
      - "-c"
      - "max_parallel_workers_per_gather=${PG_MAX_PARALLEL_WORKERS_PER_GATHER:-4}"
    environment:
      POSTGRES_USER: filebrowser
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-filebrowser}
      POSTGRES_DB: filebrowser
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U filebrowser"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  web:
    image: file-browser-web:latest
    platform: linux/amd64
    pull_policy: never
    build:
      context: .
      platforms:
        - linux/amd64
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://filebrowser:${POSTGRES_PASSWORD:-filebrowser}@db:5432/filebrowser
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-4}
    ports:
      - "${APP_PORT:-8000}:8000"
    restart: unless-stopped

volumes:
  pgdata:
